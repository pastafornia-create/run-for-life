<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Run for Hope &amp; Solidarity · Maquettes</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#E6DFD5}
section{display:flex;gap:64px;align-items:flex-start;padding:64px;width:max-content}
.col{display:flex;flex-direction:column;gap:14px}
.label{font-family:'DM Mono',monospace;font-size:14px;color:#1A1412}
.note{font-family:'DM Mono',monospace;font-size:12px;color:#6E5A4A;max-width:390px}
</style>
</head>
<body>
<section>
  <div class="col">
    <span class="label">Desktop · 1440</span>
    <iframe src="index.html" title="Desktop" style="width:1440px;height:5600px;border:0;border-radius:16px;background:#F7F1E8;box-shadow:0 20px 60px rgba(26,20,18,.15)"></iframe>
  </div>
  <div class="col">
    <span class="label">Mobile · 390</span>
    <iframe src="index.html" title="Mobile" style="width:390px;height:844px;border:10px solid #1A1412;border-radius:48px;background:#F7F1E8;box-shadow:0 20px 60px rgba(26,20,18,.2)"></iframe>
    <span class="note">Faites défiler dans le téléphone</span>
  </div>
</section>
</body>
</html>
